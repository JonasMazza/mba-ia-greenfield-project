services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube
      # MinIO does not implement the per-bucket S3 CORS API — CORS is server-wide.
      # Its handler already exposes ETag, which the browser needs to read each
      # part's ETag and finish CompleteMultipartUpload.
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the two private buckets. CORS is server-wide on the minio
  # service — see MINIO_API_CORS_ALLOW_ORIGIN. Abandoned multipart uploads are
  # reclaimed by the explicit abort endpoint (DELETE /videos/:publicId/upload);
  # a lifecycle rule as a safety net is a follow-up (mc cannot express
  # AbortIncompleteMultipartUpload — it drops the field on import).
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set st http://minio:9000 streamtube streamtube;
      mc mb --ignore-existing st/streamtube-raw;
      mc mb --ignore-existing st/streamtube-processed;
      mc anonymous set none st/streamtube-raw;
      mc anonymous set none st/streamtube-processed;
      echo 'minio bootstrap done'
      "

volumes:
  minio-data:
